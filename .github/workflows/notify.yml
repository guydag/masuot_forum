name: Notify about new reports
on:
  schedule:
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:
concurrency:
  group: notify
  cancel-in-progress: false
permissions:
  contents: read
  actions: write
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --prefix scripts --no-audit --no-fund
      - run: node scripts/notify.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      # If no Excel sync is running or waiting (GitHub sometimes drops the run that should start the next one), start one.
      - name: Keep the Excel sync running
        if: always()
        run: |
          n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow calsync.yml --json status --jq '[.[] | select(.status=="in_progress" or .status=="queued" or .status=="waiting" or .status=="pending")] | length')
          echo "running/queued sync runs: $n"
          if [ "$n" = "0" ]; then
            for i in 1 2 3 4 5; do gh workflow run calsync.yml --ref main -R "$GITHUB_REPOSITORY" && { echo "started the sync"; break; }; sleep $((i * 10)); done
          fi
        env:
          GH_TOKEN: ${{ github.token }}
