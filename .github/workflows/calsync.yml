name: Sync the yearly schedule with Excel
on:
  schedule:
    # Each run keeps watching for ~50 minutes; a new one starts when it ends, so changes sync within seconds.
    - cron: "*/20 * * * *"
  workflow_dispatch:
concurrency:
  group: calsync
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - run: python -u scripts/calsync.py --watch 50
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
